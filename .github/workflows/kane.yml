name: Kane Verification

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli@0.7.0

      - name: Verify browser and Kane
        run: |
          google-chrome --version
          kane-cli --version

      - name: Authenticate Kane
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          test -n "$LT_USERNAME" || { echo 'LT_USERNAME secret is missing'; exit 2; }
          test -n "$LT_ACCESS_KEY" || { echo 'LT_ACCESS_KEY secret is missing'; exit 2; }
          kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"
          kane-cli whoami

      - name: Start ProofLoop
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/proofloop-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              echo 'ProofLoop local server is ready'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/proofloop-vite.log
          exit 1

      - name: Run local ProofBoard verification
        run: npm run verify:kane 2>&1 | tee /tmp/kane-local.log

      - name: Wait for Vercel production
        env:
          PRODUCTION_URL: https://proof-loop-pawansatoshis-projects.vercel.app/
        run: |
          echo "Waiting for production deployment at $PRODUCTION_URL..."
          for i in {1..90}; do
            if curl -fsS "$PRODUCTION_URL" >/dev/null; then
              echo 'Production endpoint is reachable'
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run production ProofBoard verification
        env:
          PRODUCTION_URL: https://proof-loop-pawansatoshis-projects.vercel.app/
        run: npm run verify:kane:production 2>&1 | tee /tmp/kane-production.log

      - name: Upload Kane evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofloop-kane-evidence-${{ github.run_id }}
          path: |
            .testmuai/output/
            /tmp/kane-local.log
            /tmp/kane-production.log
            /tmp/proofloop-vite.log
          if-no-files-found: ignore
          retention-days: 14
